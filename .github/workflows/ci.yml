name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff, pinned)
        run: ruff check src tests evals
      - name: Tests
        run: pytest -q --tb=short

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t alphaforge:${{ github.sha }} .
      - name: Smoke-run image (headless synthetic pipeline)
        run: |
          docker run --rm alphaforge:${{ github.sha }} "post-earnings drift in megacap tech"
