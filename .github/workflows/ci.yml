name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff, pinned)
        run: ruff check src tests evals
      - name: Tests
        run: pytest -q --tb=short
      - name: 3-seed stability (synthetic, template backend)
        run: |
          python evals/harness.py --limit 5 --agent-seed 42  --out evals/stability_s42.json
          python evals/harness.py --limit 5 --agent-seed 123 --out evals/stability_s123.json
          python evals/harness.py --limit 5 --agent-seed 2024 --out evals/stability_s2024.json
          python - <<'EOF'
          import json
          for s in [42, 123, 2024]:
              r = json.load(open(f"evals/stability_s{s}.json"))
              assert r["task_completion_rate"] == 1.0, f"seed {s}: rate={r['task_completion_rate']}"
              print(f"seed {s}: completion={r['task_completion_rate']:.0%} ✓")
          EOF

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t alphaforge:${{ github.sha }} .
      - name: Smoke-run image (headless synthetic pipeline)
        run: |
          docker run --rm alphaforge:${{ github.sha }} "post-earnings drift in megacap tech"
